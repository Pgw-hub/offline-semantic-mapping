# 2026-10-23 20:19 KAIST DTIPS 데이터셋 — 핸드헬드 리그(Mid-360 + D455, livox_d455_rig) 실외 야간 보도·자전거길, 원본 ~13 분(log_000–012).
# 위치추정(LIO) 이 녹화 시작 후 ~560 s 부터 발산(초당 10–80 m 순간이동, z +12 → −34 m) → 0–558 s 만 사용: log_000–008 + 558 s 에서 자른 log_009.
#   원본 log_009·log_010–012 는 /data2/20261023/kaist_dtips/excluded_diverged/ (log_012 는 끝이 잘려 앞 38.6 s 만 복구), log_013–018 은 0 으로 채워진 빈 파일이라 복사 안 함.
# 원본 config_snapshot·session_window·log_manifest 가 0 바이트(비어 있음) → calibration 은 10/16 핸드헬드(dungok_2f_office) 것을 복사(mcap tf_static 리그 값 동일 확인).
# 카메라는 녹화된 캘리브레이션 그대로 (LiDAR 와 ~3° 어긋남 의심). 실외 → Mapillary 도로 모델.
