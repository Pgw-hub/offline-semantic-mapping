# 2026-09-23 시뮬레이션(dungok_nav_testbed_2f) 계단 데이터 — 레코더 v2(raisin_pod ROS 레이아웃). 저장 지도(.pcd/.txt) 없음 → 키프레임 자세는 /path/pgo 마지막 메시지 + 오도메트리 매칭(graph/keyframes_tum.txt).
# calibration 은 0921 시뮬 데이터의 raisin_config/calibration 복사(동일 시뮬 로봇). sim: livox_flip false, lidar_extrinsic slam.
root: t2_sim_0923_stairs
mcap_dir: /data2/20260923/railab_raibo_20260923_062441
logs:
- 0
- 1
options:
  map_id: "sim dungok 2F stairs 20260923 · track 2 keyframe_scans + depth fill · voxel3d prior"
  robot_map:
    geometry: all_scans        # /path/pgo 키프레임이 19개뿐(1.5 s 간격) → 라벨링 기하는 전체 스캔(Δ 보간). voxel3d 는 원래 전체 스캔 사용
  lidar_extrinsic: slam
  livox_flip: false
  lidar_fusion: false
  mask_bottom_px: 60
  drop_classes: person
  vlm_edges: false
  occupancy_res: 0.2
  prob_hit: 0.85
  prob_miss: 0.45
  costmap: {h_ground: 2, h_obs: 3, clearance: 1.4, band_min: 0.3}
  view_cubes: false
  view_coarse: 0.3
  video_speed: 15
  video_pipeline: true
  classdict: indoor_v1
  label_edge_px: 4
  require_depth: true
  pose_graph: true
  depth_fill_range: 4.0
  depth_fill_gap: 0.15
  pair_ms: 250               # sim rgb/depth 비동기(약 80 ms 오프셋, 각 2.2~2.4 Hz)
